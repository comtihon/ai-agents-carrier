apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-agents-carrier.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ai-agents-carrier.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ai-agents-carrier.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "ai-agents-carrier.serviceAccountName" . }}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
{{- if or .Values.config .Values.llmIntegrations .Values.mcpIntegrations }}
          envFrom:
            - configMapRef:
                name: {{ include "ai-agents-carrier.fullname" . }}-config
{{- end }}
{{- if or .Values.secrets .Values.llmIntegrations .Values.mcpIntegrations }}
          env:
{{- range $envKey, $secret := .Values.secrets }}
            - name: {{ $envKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret.name }}
                  key: {{ $secret.key }}
{{- end }}
{{- range $cfg := .Values.llmIntegrations }}
{{- if $cfg.apiKeySecret }}
            - name: {{ default (printf "%s_API_KEY" (upper (replace "-" "_" $cfg.name))) $cfg.apiKeyEnv }}
              valueFrom:
                secretKeyRef:
                  name: {{ $cfg.apiKeySecret.name }}
                  key: {{ $cfg.apiKeySecret.key }}
{{- end }}
{{- end }}
{{- range $cfg := .Values.mcpIntegrations }}
{{- if $cfg.apiKeySecret }}
            - name: {{ include "ai-agents-carrier.mcpApiKeyEnv" $cfg }}
              valueFrom:
                secretKeyRef:
                  name: {{ $cfg.apiKeySecret.name }}
                  key: {{ $cfg.apiKeySecret.key }}
{{- end }}
{{- end }}
{{- end }}
          # A startup probe, because this container's boot is genuinely slow:
          # a uvx install for the jira MCP server, 63 tools, every workflow
          # definition. The liveness probe below used to police that window
          # and killed the container mid-boot whenever anything made startup a
          # little slower. With a startupProbe the liveness probe does not run
          # until the app has answered once, so liveness means "wedged" again
          # rather than "slow to start".
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60      # up to 5 minutes to come up
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
{{- if .Values.graphs }}
          volumeMounts:
            - name: graph-definitions
              mountPath: /app/graphs
              readOnly: true
{{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
{{- if .Values.graphs }}
      volumes:
        - name: graph-definitions
          configMap:
            name: {{ include "ai-agents-carrier.fullname" . }}-graphs
{{- end }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
