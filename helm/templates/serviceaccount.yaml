{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-agents-carrier.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
  labels:
    app.kubernetes.io/name: {{ include "ai-agents-carrier.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
