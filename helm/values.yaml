replicaCount: 1

image:
  repository: ghcr.io/comtihon/ai-agents-carrier
  tag: v1.2.142
  pullPolicy: IfNotPresent

serviceAccount:
  # Create the ServiceAccount with the release. Set false when it is managed
  # elsewhere (terraform, for instance) — the deployment and the RoleBinding
  # then point at `name` without the chart trying to own it.
  create: true
  # Empty = the release fullname.
  name: ""
  # Annotations for a chart-created ServiceAccount, e.g. binding it to a GCP
  # service account for Workload Identity:
  #   iam.gke.io/gcp-service-account: my-gsa@my-project.iam.gserviceaccount.com
  annotations: {}

service:
  type: ClusterIP
  port: 8000

# All non-secret env vars passed to the container as a ConfigMap.
# Keys become env var names; values become env var values.
config: {}

# Secrets injected as individual env vars.
# Key becomes the env var name (uppercased if needed by convention).
# Value must have 'name' (k8s Secret name) and 'key' (Secret data key).
# Example:
#   ANTHROPIC_API_KEY:
#     name: langgraph-backend-secrets
#     key: ANTHROPIC_API_KEY
secrets: {}

# LLM provider integrations. Free-form list — any entry that exposes an
# OpenAI / LiteLLM-compatible HTTP endpoint can be added without code changes.
# Each entry is rendered into:
#   ConfigMap: LLM_INTEGRATIONS (JSON-encoded list, minus the secret api key)
#   Deployment env: <NAME>_API_KEY from the referenced k8s Secret
#     (NAME uppercased, dashes → underscores)
# Use `apiKeyEnv` to override the env var name explicitly.
# Example:
#   llmIntegrations:
#     - name: anthropic
#       baseUrl: https://api.anthropic.com/v1
#       defaultModel: claude-sonnet-4-6
#       apiKeySecret:
#         name: langgraph-backend-secrets
#         key: ANTHROPIC_API_KEY
#     - name: openrouter
#       baseUrl: https://openrouter.ai/api/v1
#       defaultModel: anthropic/claude-sonnet-4.5
#       apiKeySecret:
#         name: langgraph-backend-secrets
#         key: OPENROUTER_API_KEY
#     - name: my-litellm-proxy
#       baseUrl: https://proxy.example.com/v1
#       defaultModel: some/model
#       apiKeyEnv: MY_PROXY_KEY        # optional, defaults to MY_LITELLM_PROXY_API_KEY
#       apiKeySecret:
#         name: my-proxy-secret
#         key: API_KEY
llmIntegrations: []

# MCP servers agents may be granted. Free-form list — any MCP server reachable
# over streamable HTTP / SSE, or runnable as a stdio command, can be added
# without code changes. Each entry is rendered into:
#   ConfigMap: MCP_INTEGRATIONS (JSON-encoded list, minus the secret api key)
#   Deployment env: the `apiKeyEnv` var from the referenced k8s Secret
#     (defaults to <NAME>_MCP_API_KEY, uppercased, dashes → underscores)
# A server declared here is only *grantable*: an agent receives it at spawn time
# when its `mcp` addon has that server checked, and never otherwise.
#
# Fields (all optional except `name` and `transport`):
#   name          server name, as shown in the UI's mcp addon picker
#   enabled       false hides it from agents without deleting the entry (default true)
#   transport     streamable_http | sse | stdio
#   url           endpoint (HTTP transports)
#   agentUrl      endpoint a spawned agent must dial instead, when the one
#                 above is not resolvable from an agent pod
#   auth          bearer (default) | none. HTTP transports only: `none` states
#                 the endpoint wants no credential. A bearer entry with no
#                 token resolving is reported as incomplete rather than ready,
#                 so an unwired token surfaces before an agent hits it.
#   apiKeyEnv     env var carrying the bearer token; pair with apiKeySecret
#   apiKeySecret  {name, key} of the k8s Secret holding that token
#   command/args  binary + argv (stdio transport)
#   env           literal env vars for a stdio server
#   envFromConfig  {ENV_NAME: CONFIG_KEY} — copies a backend env var / .env key
#                  into the stdio server's env, so its secrets stay in Secrets
#   prestartHttp  false when the CLI cannot be re-hosted over HTTP by the agent
#   eagerStart    false when the backend must not dial it during startup
#
# Example:
#   mcpIntegrations:
#     - name: github
#       transport: streamable_http
#       url: https://api.githubcopilot.com/mcp/
#       apiKeySecret:
#         name: langgraph-backend-secrets
#         key: GITHUB_MCP_TOKEN
#     - name: hubspot
#       transport: streamable_http
#       url: https://mcp.hubspot.com/anthropic
#       apiKeySecret:
#         name: langgraph-backend-secrets
#         key: HUBSPOT_MCP_TOKEN
#     - name: jira
#       transport: stdio
#       command: uvx
#       args: ["mcp-atlassian"]
#       envFromConfig:
#         JIRA_URL: MCP_JIRA_JIRA_URL
#         JIRA_USERNAME: MCP_JIRA_USERNAME
#         JIRA_API_TOKEN: MCP_JIRA_API_TOKEN
#     - name: semble
#       transport: stdio
#       command: semble
#       prestartHttp: false     # CLI has no --transport/--port flags
#       eagerStart: false       # agent-side binary, absent from this container
#
# The in-process `datasources` server is always available and needs no entry
# here — it is how every configured data source reaches an agent. The backend
# dials it over loopback and hands agents AGENT_CALLBACK_URL (or BASE_URL)
# + /mcp/datasources instead, so set MCP_DATASOURCES_API_KEY for the backend's
# own loopback client. Toggle it with MCP_DATASOURCES_ENABLED, or declare an
# entry named `datasources` to override its addressing.
#
# It is deliberately NOT offered in the mcp addon picker: ticking it would grant
# every operation of every registered data source at once, writes and deletes
# included, executed under this backend's own identity. An agent gets data
# source access from a `datasource` addon instead — one per source, with the
# operations ticked individually — and reaches the mount with a signed,
# per-run capability grant rather than the shared API key. Two settings govern
# those grants:
#
#   DATASOURCE_GRANT_SIGNING_KEY  Signs and verifies them. Falls back to
#                                 MCP_DATASOURCES_API_KEY, so an existing
#                                 deployment keeps working; give it its own
#                                 secret in langgraph-backend-secrets so a
#                                 shared API key cannot be used to mint one.
#                                 Neither set → datasource addons grant nothing.
#   DATASOURCE_GRANT_TTL_SECONDS  Grant lifetime (default 86400). Grants are
#                                 stateless, so this is the revocation window:
#                                 terminating a run does not instantly kill its
#                                 grant.
#
# MCP_DATASOURCES_ALLOWED_HOSTS overrides the Host headers the mount's
# DNS-rebinding guard accepts. Unset, they are derived from AGENT_CALLBACK_URL /
# BASE_URL (plus loopback), which is what a spawned agent dials; set it only
# when an agent reaches the backend under a name the backend does not know it
# has, e.g. behind a service-mesh or ingress rewrite.
mcpIntegrations: []

# Graph definitions mounted as YAML files under GRAPH_DEFINITIONS_PATH.
# Key becomes the file name (without .yaml extension), value is the YAML content.
graphs: {}

ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
  hosts: []
  # - host: langgraph.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  tls: []
  # - secretName: langgraph-backend-tls
  #   hosts:
  #     - langgraph.example.com

resources: {}
nodeSelector: {}
affinity: {}
tolerations: []
