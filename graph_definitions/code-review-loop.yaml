id: code-review-loop
name: "Code Review Loop"
description: "Plan → Execute → Code Review with revision loop. Code review routes back to execute on failure."
max_iterations: 3

steps:
  - id: plan
    type: llm
    output_key: plan
    system_prompt: "You are a planning assistant. Create a concise implementation plan."
    user_template: "{request}"

  - id: execute
    type: claude-agent
    agent_id: engineer            # must exist in /api/v1/agents
    system_prompt: >
      You are a software engineer. Implement the plan.
      Previous feedback (if any): {feedback}.
      Return a JSON object with `result` (description of what was implemented)
      and `code` (the code written).
    user_template: "Plan: {plan}\nPrevious feedback: {feedback}"
    output_mapping:
      result: result
      code: code
    output_key: execute_raw

  - id: code_review
    type: claude-agent
    agent_id: reviewer            # must exist in /api/v1/agents
    system_prompt: >
      You are a code reviewer. Review the implementation against the plan.
      Return a JSON object with `feedback` (review notes; if passing, confirm
      what was done well) and `passed` (true if the implementation passes
      review, false if it needs revision).
    user_template: "Plan: {plan}\nImplementation: {result}\nCode:\n{code}"
    output_mapping:
      feedback: feedback
      passed: passed
    output_key: code_review_raw
    routes:
      - when: passed
        next: notify
      - next: execute

  - id: notify
    type: http_call
    url: "https://example.com/notify"
    method: POST
    body:
      result: "{result}"
      feedback: "{feedback}"
    output_key: notification
